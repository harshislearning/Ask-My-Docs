[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askmydocs"
version = "0.1.0"
description = "Production-grade domain-specific RAG over a PDF knowledge base"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Base dependencies = everything ingestion needs.
# Heavy ML / serving deps live in extras so `ingest` does not drag in torch.
dependencies = [
    "pymupdf>=1.24.0",
    "langchain-text-splitters>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "tokenizers>=0.19.0",
    "transformers>=4.44.0",
]

[project.optional-dependencies]
# Phase 2-3: embeddings, vector index, keyword index, reranker
ml = [
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
]
# Phase 4-5: generation + verification.
# No retry library: backoff is hand-rolled in groq_client so every attempt is
# logged as structured data and Retry-After is honoured.
llm = [
    "groq>=0.11.0",
]
# Phase 6-7: API + UI
serve = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    # starlette 1.4 made GZipResponder.thread_minimum_size a required kwarg;
    # streamlit's _MediaAwareGZipResponder subclasses it without passing one, so
    # every page load 500s. Both packages allow <2, so pip is free to pick the
    # broken combination - pin until streamlit catches up.
    "starlette>=0.46.0,<1.4.0",
]
# Phase 8: evaluation harness
eval = [
    "ragas>=0.2.0",
    "datasets>=2.20.0",
    "pandas>=2.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/askmydocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that download models or hit the network",
    "integration: tests that exercise more than one module together",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
packages = ["askmydocs"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
