# Config for the CI evaluation gate.
#
# Deliberately mirrors config/default.yaml for everything that affects quality -
# chunking, retrieval, reranking - so the gate measures the real system rather
# than a miniature of it. Only the paths and the evaluation targets differ.
#
# Config files are loaded whole, not merged, so this file has to be complete.
# When you change a tunable in default.yaml, change it here too or the gate
# stops describing what you actually ship.

paths:
  raw_pdfs: .ci/raw_pdfs
  processed: .ci/processed
  indexes: .ci/indexes
  chunks_file: .ci/processed/chunks.jsonl
  manifest_file: .ci/processed/manifest.json

logging:
  level: WARNING
  format: json

ingestion:
  scanned_page_char_threshold: 50
  scanned_doc_page_ratio: 0.8
  furniture_page_ratio: 0.6
  furniture_margin_ratio: 0.12
  furniture_max_chars: 120
  extract_tables: true
  max_file_mb: 100

structure:
  heading_size_ratio: 1.15
  heading_max_words: 12
  bold_qualifies_as_heading: true
  numbered_heading_patterns:
    - '^\d+(\.\d+)*[\.\)]?\s+\S'
    - '^(Chapter|Section|Part|Appendix)\s+([0-9]+|[A-Z])\b'
    - '^[A-Z][A-Z0-9 \-/&]{3,}$'
  min_headings_per_page: 0.33
  max_heading_depth: 4

chunking:
  chunk_tokens: 450
  chunk_overlap_tokens: 60
  min_section_tokens: 80
  keep_tables_atomic: true
  prepend_breadcrumb: true
  separators: ["\n\n", "\n", ". ", "; ", " "]
  tokenizer_model: BAAI/bge-base-en-v1.5

embedding:
  model: BAAI/bge-base-en-v1.5
  batch_size: 32
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "
  device: cpu

retrieval:
  vector_top_n: 30
  bm25_top_n: 30
  rrf_k: 60
  vector_weight: 1.0
  bm25_weight: 1.0
  bm25_k1: 1.5
  bm25_b: 0.75
  rerank_enabled: true
  rerank_top_k: 6
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_batch_size: 32
  rerank_max_length: 512
  min_rerank_score: null

generation:
  model: llama-3.3-70b-versatile
  temperature: 0.1
  max_tokens: 1024
  request_timeout_s: 60
  max_retries: 4
  retry_base_delay_s: 1.0
  retry_max_delay_s: 20.0
  max_context_tokens: 6000
  refusal_text: "I don't have enough information in the provided sources to answer that."

verification:
  enabled: true
  entailment_mode: "heuristic"
  flag_uncited_claims: true
  min_claim_words: 3
  min_identifier_length: 4
  entailment_max_claims: 12

evaluation:
  golden_set: eval/golden/ci_golden_set.jsonl
  baseline_file: eval/baselines/ci_baseline.json
  runs_dir: eval/runs
  k_values: [1, 3, 5, 10]
  use_ragas: false
  ragas_metrics: [faithfulness, answer_relevancy]

  # CI runs with --no-generate, so only the retrieval blocks exist to gate on.
  # Tolerances are loose enough to absorb small float differences between the
  # machine that recorded the baseline and the runner that checks it, and tight
  # enough to catch a chunking or fusion change that actually moves the ranking.
  gates:
    - metric: reranked.recall@5
      max_drop: 0.05
    - metric: reranked.mrr
      max_drop: 0.05
    - metric: reranked.ndcg@5
      max_drop: 0.05
    - metric: retrieval.recall@5
      max_drop: 0.05
    - metric: retrieval.mrr
      max_drop: 0.05
