# Config used by the test suite and CI. Deliberately tiny and offline-safe:
# no model downloads, no network. Anything not listed falls back to the
# defaults in default.yaml only if explicitly merged - tests load this file
# whole, so it must be self-contained.

paths:
  raw_pdfs: .test_data/raw_pdfs
  processed: .test_data/processed
  indexes: .test_data/indexes
  chunks_file: .test_data/processed/chunks.jsonl
  manifest_file: .test_data/processed/manifest.json

logging:
  level: WARNING
  format: json

ingestion:
  scanned_page_char_threshold: 50
  scanned_doc_page_ratio: 0.8
  furniture_page_ratio: 0.6
  furniture_margin_ratio: 0.12
  furniture_max_chars: 120
  extract_tables: true
  max_file_mb: 100

structure:
  heading_size_ratio: 1.15
  heading_max_words: 12
  bold_qualifies_as_heading: true
  numbered_heading_patterns:
    - '^\d+(\.\d+)*[\.\)]?\s+\S'
    - '^(Chapter|Section|Part|Appendix)\s+([0-9]+|[A-Z])\b'
    - '^[A-Z][A-Z0-9 \-/&]{3,}$'
  min_headings_per_page: 0.33
  max_heading_depth: 4

chunking:
  # Small numbers so fixtures stay readable and assertions stay obvious.
  chunk_tokens: 60
  chunk_overlap_tokens: 10
  min_section_tokens: 8
  keep_tables_atomic: true
  prepend_breadcrumb: true
  separators: ["\n\n", "\n", ". ", "; ", " "]
  tokenizer_model: BAAI/bge-base-en-v1.5

embedding:
  model: BAAI/bge-base-en-v1.5
  batch_size: 4
  normalize: true
  query_prefix: "Represent this sentence for searching relevant passages: "
  device: cpu

retrieval:
  vector_top_n: 5
  bm25_top_n: 5
  rrf_k: 60
  vector_weight: 1.0
  bm25_weight: 1.0
  bm25_k1: 1.5
  bm25_b: 0.75
  rerank_enabled: true
  rerank_top_k: 3
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_batch_size: 4
  rerank_max_length: 512
  min_rerank_score: null

generation:
  model: llama-3.3-70b-versatile
  temperature: 0.0
  max_tokens: 256
  request_timeout_s: 10
  max_retries: 1
  retry_base_delay_s: 0.01
  retry_max_delay_s: 0.05
  max_context_tokens: 400
  refusal_text: "I don't have enough information in the provided sources to answer that."

verification:
  enabled: true
  # Never "llm" in tests or CI: the suite must stay offline and deterministic.
  entailment_mode: "heuristic"
  flag_uncited_claims: true
  min_claim_words: 3
  min_identifier_length: 4
  entailment_max_claims: 12

evaluation:
  golden_set: eval/golden/ci_golden_set.jsonl
  baseline_file: eval/baselines/ci_baseline.json
  runs_dir: eval/runs
  k_values: [1, 3, 5]
  use_ragas: false
  ragas_metrics: [faithfulness, answer_relevancy]
  # CI runs with --no-generate, so only retrieval metrics are gated.
  gates:
    - metric: reranked.recall@5
      max_drop: 0.05
    - metric: reranked.mrr
      max_drop: 0.05
    - metric: reranked.ndcg@5
      max_drop: 0.05
